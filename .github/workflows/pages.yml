name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test server and concurrent bookings
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check public source
        run: node tests/check-static.mjs
      - name: Install browser checks
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify browser and local server flows
        run: |
          npm run test:browser
          npm run test:server-ui
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
